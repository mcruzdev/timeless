# Common - applies to every profile

# security
security.sensible.secret=${SECURITY_KEY}

# WhatsApp queues (custom properties read by the application code)
whatsapp.incoming-message.queue-url=${INCOMING_MESSAGE_FIFO_URL}
whatsapp.recognized-message.queue-url=${RECOGNIZED_MESSAGE_FIFO_URL}

# smallrye reactive messaging sqs (incoming channel)
# note: this connector has its own AWS config and does not read quarkus.sqs.*
mp.messaging.incoming.whatsapp-incoming.connector=smallrye-sqs
mp.messaging.incoming.whatsapp-incoming.queue.url=${INCOMING_MESSAGE_FIFO_URL}
mp.messaging.incoming.whatsapp-incoming.visibility-timeout=30

# aws sqs (plain client, used by the outbox sender)
quarkus.sqs.devservices.enabled=false

# hibernate orm
quarkus.hibernate-orm.schema-management.strategy=update

# quinoa (frontend)
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.run-tests=false
quarkus.quinoa.build-dir=dist/timeless/browser

# jwt
mp.jwt.verify.issuer=https://timelessapp.platformoon.com/issuer
# stamp the same iss on tokens we sign, otherwise verification rejects them (401)
smallrye.jwt.new-token.issuer=https://timelessapp.platformoon.com/issuer


# dev profile - ./mvnw quarkus:dev : OpenAI plus LocalStack

%dev.security.sensible.secret=YS0xNi1ieXRlLXNlY3JldA==

# sqs to localstack
%dev.mp.messaging.incoming.whatsapp-incoming.region=us-east-1
%dev.mp.messaging.incoming.whatsapp-incoming.endpoint-override=http://localhost:4566
%dev.quarkus.sqs.endpoint-override=http://localhost:4566
%dev.quarkus.sqs.aws.region=us-east-1
%dev.quarkus.sqs.aws.credentials.type=STATIC
%dev.quarkus.sqs.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.sqs.aws.credentials.static-provider.secret-access-key=test

# ai to openai
%dev.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
%dev.quarkus.langchain4j.openai.gpt-4-turbo.api-key=${OPENAI_API_KEY}

# jwt bundled dev keys under src/main/resources (not for production)
%dev.mp.jwt.verify.publickey.location=publicKey.pem
%dev.smallrye.jwt.sign.key.location=privateKey.pem

# db
%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
%dev.quarkus.hibernate-orm.log.sql=true


# local profile - ./mvnw quarkus:dev -Pollama -Dquarkus.profile=local : Ollama plus LocalStack

# sqs to localstack
%local.mp.messaging.incoming.whatsapp-incoming.region=us-east-1
%local.mp.messaging.incoming.whatsapp-incoming.endpoint-override=http://localhost:4566
%local.quarkus.sqs.endpoint-override=http://localhost:4566
%local.quarkus.sqs.aws.region=us-east-1
%local.quarkus.sqs.aws.credentials.type=STATIC
%local.quarkus.sqs.aws.credentials.static-provider.access-key-id=test
%local.quarkus.sqs.aws.credentials.static-provider.secret-access-key=test

# ai to ollama
%local.quarkus.langchain4j.ollama.base-url=http://localhost:11434/
%local.quarkus.langchain4j.ollama.chat-model.model-id=llama3.2-vision:11b

# jwt bundled dev keys under src/main/resources (not for production)
%local.mp.jwt.verify.publickey.location=publicKey.pem
%local.smallrye.jwt.sign.key.location=privateKey.pem


# test profile - QuarkusTest

%test.security.sensible.secret=YS0xNi1ieXRlLXNlY3JldA==

# whatsapp queues, fixed test values
%test.whatsapp.incoming-message.queue-url=test-incoming-queue
%test.whatsapp.recognized-message.queue-url=test-processed-queue

# sqs to localstack
%test.quarkus.sqs.endpoint-override=http://127.0.0.1:4566
%test.quarkus.sqs.aws.region=us-east-1
%test.quarkus.sqs.aws.credentials.type=STATIC
%test.quarkus.sqs.aws.credentials.static-provider.access-key-id=test
%test.quarkus.sqs.aws.credentials.static-provider.secret-access-key=test

# jwt
%test.mp.jwt.verify.publickey=test-public-key

# disable background integrations during tests
%test.quarkus.scheduler.enabled=false
%test.quarkus.langchain4j.openai.enable-integration=false

%quarkus.test.arg-line=--add-opens java.base/java.lang=ALL-UNNAMED


# aws and prod profiles - deployed, keys and queue URLs come from the environment

%aws.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%aws.smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
